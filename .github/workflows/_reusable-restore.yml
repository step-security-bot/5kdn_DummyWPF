# ---------------------------------------------------------------------
# reusable restore
# ---------------------------------------------------------------------

name: reusable Restore

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: "The version of .NET to use"
        type: string
        required: true
        default: "8.0.x"
      os:
        description: "The OS to run the job on"
        type: string
        required: true
        default: "ubuntu-latest"

permissions:
  contents: write           # テスト
  pull-requests: write      # テスト

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1


jobs:
  restore:
    name: Restore
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Caching Nuget
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            **/obj/**
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: restore
        shell:
        run: dotnet restore
