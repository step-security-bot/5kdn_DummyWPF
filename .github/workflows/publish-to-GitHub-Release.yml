# ---------------------------------------------------------------------
# 1) restore -> publish -> archive
# 2) release publish
# ---------------------------------------------------------------------

name: Publish to GitHub Release

on:
  release:
    types: ["published", "prereleased"]

permissions: read-all

env:
  # act でワークフローを実行しているか確認するフラグ
  ACT: false
  # windows-latest 専用: ローカル汚染防止・NuGet高速化・locked restore
  # ── すべての“ユーザ領域”をワークスペースに隔離 ──────────────
  HOME:               ${{ github.workspace }}\.home
  USERPROFILE:        ${{ github.workspace }}\.home
  LOCALAPPDATA:       ${{ github.workspace }}\.localappdata
  TEMP:               ${{ github.workspace }}\.tmp
  TMP:                ${{ github.workspace }}\.tmp

  # ── .NET / NuGet をワークスペース配下に固定 ──────────────
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  DOTNET_CLI_HOME:    ${{ github.workspace }}\.cache\dotnet
  DOTNET_ROOT:        ${{ github.workspace }}\.cache\dotnet

  # NuGet パッケージ/HTTPキャッシュの固定パス ──────────────
  NUGET_PACKAGES:         ${{ github.workspace }}\.cache\nuget\packages
  NUGET_HTTP_CACHE_PATH:  ${{ github.workspace }}\.cache\nuget\v3-cache
  # パブリッシュに必要な変数 ──────────────
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - id: out
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  Release:
    name: Release(${{ matrix.rid }})
    runs-on: windows-latest
    needs: prep
    permissions:
      actions: write
      contents: read
    strategy:
      matrix:
        dotnet-version: ["8.0.x"]
        rid: ["win-x64", "win-x86"]
        release-target: ["DummyWPF/DummyWPF.csproj"]
    env:
      VERSION: ${{needs.prep.outputs.version}}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v5
      - name: Caching Nuget packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.nuget/packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-${{ hashFiles('**/packages.lock.json','**/Directory.Packages.props','global.json','NuGet.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-
            nuget-${{ runner.os }}-
      - name: Cache HTTP v3 cache (Windows)
        uses: actions/cache@v4
        with:
          path: |
            $LOCALAPPDATA\NuGet\v3-cache
          key: nugethttp-${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props', 'global.json', 'NuGet.config') }}
          restore-keys: |
            nugethttp-${{ runner.os }}-${{ matrix.rid }}-dotnet-${{ matrix.dotnet-version }}-
            nugethttp-${{ runner.os }}-${{ matrix.rid }}-
            nugethttp-${{ runner.os }}-

      - name: Setup .NET ${{ matrix.dotnet-version }}
        if: ${{ env.ACT != 'true' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore (${{ matrix.rid }})
        run:  dotnet restore --locked-mode

      - name: Publish
        run: >
          dotnet publish ${{ matrix.release-target }}
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:ContinuousIntegrationBuild=true
          ${{ env.ACT == 'true' && '-p:DebugType=none -p:DebugSymbols=false' || '' }}
          --no-restore

      - name: Archive artifacts
        shell: pwsh
        run: |
          $dest = "${{ env.APP_NAME }}-$Env:VERSION-${{ matrix.rid }}.zip"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $dest -CompressionLevel Optimal
          # generate SHA256 checksum
          $hash = Get-FileHash -Path $dest -Algorithm SHA256
          $shaFile = "$dest.sha256"
          Set-Content -Path $shaFile -Value "$($hash.Hash)  $(Split-Path $dest -Leaf)"

      - name: Upload artifact (zip + sha256)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: |
            ${{ env.APP_NAME }}-${{env.VERSION}}-${{ matrix.rid }}.zip
            ${{ env.APP_NAME }}-${{env.VERSION}}-${{ matrix.rid }}.zip.sha256
          if-no-files-found: error


  Publish-to-GitHub-Release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: ["Release"]
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{needs.prep.outputs.version}}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: verify checksums
        run: |
          # 各 .sha256 があるディレクトリで sha256sum -c を実行
          find dist -type f -name "*.sha256" -print0 | while IFS= read -r -d '' shaFile; do
            (
              cd -- "$(dirname -- "$shaFile")" &&
              tr -d '\r' < "$(basename -- "$shaFile")" | sha256sum -c -
            )
          done

      - name: Attach assets to the current Release
        if: env.ACT != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
