# ---------------------------------------------------------------------
# 1) restore -> publish -> archive
# 2) release publish
# ---------------------------------------------------------------------

name: Publish to GitHub Release

on:
  release:
    types: ["published", "prereleased"]

permissions:
  contents: write
  actions:  read

env:
  runner: ubuntu
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  APP_NAME: MyApp
  VERSION: "1.2.3"


jobs:
  call-restore:
    uses: ./.github/workflows/_reusable-restore.yml
    with:
      dotnet-version: 8.0.x
      os: ubuntu-latest


  Release:
    name: Release(${{ matrix.RID }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        RID: ["linux-x64", "linux-x86"]
    env:
      RID: ${{ matrix.RID }}
    steps:
      - uses: actions/checkout@v5

      - name: Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: restore
        shell:
        run: dotnet restore

      - name: publish
        run: >
          dotnet publish DummyLib/DummyLib.csproj
          -c Release
          -r ${{ env.RID }}
          -o publish/${{ env.RID }}
          --no-restore

      - name: Archive artifacts (windows)
        if: runner.os == 'Windows'
        run: |
          $dest = "${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.RID }}.zip"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "publish/${{ env.RID }}/*" -DestinationPath $dest -CompressionLevel ${{ env.COMPRESSION_LEVEL }}
          # generate SHA256 checksum
          $hash = Get-FileHash -Path $dest -Algorithm SHA256
          $shaFile = "$dest.sha256"
          Set-Content -Path $shaFile -Value "$($hash.Hash)  $(Split-Path $dest -Leaf)"
        env:
          COMPRESSION_LEVEL: Optimal

      - name: Archive artifacts (ubuntu)
        if: runner.os == 'Linux'
        run: |
          dest="${APP_NAME}-${VERSION}-${RID}.zip"
          [ -f "$dest" ] && rm -f "$dest"
          case "${COMPRESSION_LEVEL}" in
            Optimal)      zip_level="-9" ;;
            NoCompression) zip_level="-0" ;;
            Fastest)      zip_level="-1" ;;
            *)            zip_level=""   ;;
          esac
          ( cd "publish/${RID}" && zip -r ${zip_level} "$OLDPWD/$dest" . )
          hash=$(sha256sum "$dest" | awk '{print toupper($1)}')
          printf "%s  %s\n" "$hash" "$(basename "$dest")" > "${dest}.sha256"

      - name: Upload artifact (zip + sha256)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.RID }}
          path: |
            ${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.RID }}.zip
            ${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.RID }}.zip.sha256
          if-no-files-found: error

  Publish-to-GitHub-Release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: ["Release"]
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: verify checksums
        run: |
          # 各 .sha256 があるディレクトリで sha256sum -c を実行
          find dist -type f -name "*.sha256" | while read -r shaFile; do
            ( cd "$(dirname "$shaFile")" && sha256sum -c "$(basename "$shaFile")" )
          done

      - name: Attach assets to the current Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
