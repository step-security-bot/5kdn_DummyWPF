# ------------------------------------------------------------
# Workflow Name : scorecard
# Trigger       : push (default) / schedule (weekly)
# Purpose       :
#   - OpenSSF Scorecard によるサプライチェーン健全性評価
#   - SARIF を Code Scanning にアップロード
#   - publish_results 有効化（バッジ可） ※ v2 の要件に従い権限を限定
# ------------------------------------------------------------

# TODO: step-security/harden-runner をコミュニティ版で使用するためには public repository である必要があります

name: scorecard

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '30 3 * * 0'  # weekly
  workflow_dispatch:

# Scorecard v2 の要件: グローバルに write 権限を付けない（read のみにする）
# 参考: https://github.com/marketplace/actions/ossf-scorecard-action → Workflow Restrictions
permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run Scorecard
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@3c3833e0f8c1c83d449a7478aa59c036a9165498 # v3.29.11
        with:
          sarif_file: results.sarif

      - name: Upload artifact (debug)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
